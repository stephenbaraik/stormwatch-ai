name: Data Pipeline

on:
  schedule:
    # Run daily at 2:00 AM IST (20:30 UTC previous day)
    - cron: "30 20 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2010-01-01"
      full_refresh:
        description: "Re-download all cities even if cached"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m stormwatch.data.pipeline \
            --start-date "${{ inputs.start_date || '2010-01-01' }}" \
            ${{ inputs.full_refresh && '--force' || '' }}

      - name: Upload CSVs as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: weather-data
          path: data/raw/weather_*.csv
          retention-days: 7
          if-no-files-found: ignore
