name: Data Pipeline

on:
  schedule:
    # Run daily at 2:00 AM IST (20:30 UTC previous day)
    - cron: "30 20 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2010-01-01"
      full_refresh:
        description: "Re-download all cities even if cached"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnostic — check imports and connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Checking imports ==="
          python -c "import sys; print('sys.path:', sys.path[:3])"
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, stream=sys.stderr, force=True)
          logging.info('STDOUT test: logging works')
          print('PRINT test: print works', flush=True)
          "
          echo "=== Checking external connectivity ==="
          curl -s -o /dev/null -w "Open-Meteo API: HTTP %{http_code} (%{time_total}s)\n" \
            "https://api.open-meteo.com/v1/forecast?latitude=19.076&longitude=72.8777&current=temperature_2m" || \
            echo "Open-Meteo API: FAILED"
          curl -s -o /dev/null -w "Supabase API: HTTP %{http_code} (%{time_total}s)\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" || \
            echo "Supabase API: FAILED"
          echo "=== Diagnostics complete ==="

      - name: Run data pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m stormwatch.data.pipeline \
            --start-date "${{ inputs.start_date || '2010-01-01' }}" \
            ${{ inputs.full_refresh && '--force' || '' }}

      - name: Upload CSVs as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: weather-data
          path: data/raw/weather_*.csv
          retention-days: 7
          if-no-files-found: ignore
